name: Carousel Post

on:
  workflow_dispatch:          # cron-job.org yahi trigger karega
  repository_dispatch:
    types: [carousel]

concurrency:
  group: carousel
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 35        # pehli run ke baad 20 kar sakte ho
    env:
      N8N_VERSION: "1.80.0"                  # <- apne PC wala version (n8n --version)
      N8N_DIR: 'D:\n8n'                      # D: drive C: se kaafi tez hai (install + cache restore)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODES_EXCLUDE: "[]"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Speed up (Defender off)
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath 'D:\','C:\Users','C:\carousel' -ErrorAction SilentlyContinue

      - name: Install ffmpeg
        timeout-minutes: 10
        run: choco install ffmpeg -y --no-progress

      - name: Check fonts
        shell: powershell
        run: |
          foreach($f in 'impact','palai','georgiai','Inkfree','segoescb'){
            $p = "C:\Windows\Fonts\$f.ttf"
            "{0} -> {1}" -f $f, (Test-Path $p)
          }

      - name: Restore n8n cache
        id: n8ncache
        timeout-minutes: 8
        uses: actions/cache/restore@v4
        with:
          path: D:\n8n
          key: n8n-${{ env.N8N_VERSION }}-node22-win-d

      - name: Install n8n
        if: steps.n8ncache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          npm config set progress false
          npm install --prefix $env:N8N_DIR n8n@${{ env.N8N_VERSION }} --no-audit --no-fund --prefer-offline --loglevel=error

      - name: Save n8n cache
        if: steps.n8ncache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        uses: actions/cache/save@v4
        with:
          path: D:\n8n
          key: n8n-${{ env.N8N_VERSION }}-node22-win-d

      - name: Add n8n to PATH
        run: echo "D:\n8n\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Import credentials
        timeout-minutes: 5
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CREDENTIALS_JSON)) {
            Write-Host "::error::CREDENTIALS_JSON secret khali ya missing hai (naam check karein)"
            exit 1
          }
          [IO.File]::WriteAllText("$PWD\creds.json", $env:CREDENTIALS_JSON)
          n8n import:credentials --input=creds.json
          Remove-Item creds.json

      - name: Import workflow
        timeout-minutes: 5
        run: |
          Get-ChildItem -Name *.json
          @'
          const fs = require('fs');
          let f = process.env.WF_FILE;
          if (!f || !fs.existsSync(f)) {
            f = fs.readdirSync('.').find(x => x.endsWith('.json')
              && !['package.json', 'package-lock.json', 'wf.json', 'creds.json'].includes(x)
              && fs.readFileSync(x, 'utf8').includes('nodes'));
          }
          if (!f) throw new Error('workflow json file repo me nahi mili');
          console.log('using: ' + f);
          let j = JSON.parse(fs.readFileSync(f, 'utf8'));
          if (Array.isArray(j)) j = j[0];
          j.id = 'carousel01';

          // n8n execute ko Manual Trigger chahiye. Node ka naam same rakha taake connections na tootein.
          const man = j.nodes.find(n => n.type === 'n8n-nodes-base.manualTrigger');
          if (man) {
            man.disabled = false;
            console.log('Manual Trigger pehle se maujood: ' + man.name);
          } else {
            const t = j.nodes.find(n => /scheduleTrigger|cron|webhook|Trigger$/i.test(n.type));
            if (!t) throw new Error('Workflow me koi trigger node nahi mila');
            console.log('Trigger badla: ' + t.name + ' (' + t.type + ') -> manualTrigger');
            t.type = 'n8n-nodes-base.manualTrigger';
            t.typeVersion = 1;
            t.parameters = {};
            delete t.webhookId;
          }
          fs.writeFileSync('wf.json', JSON.stringify([j]));
          '@ | Set-Content -Path fix_wf.js -Encoding utf8
          node fix_wf.js
          n8n import:workflow --input=wf.json

      - name: Run carousel workflow
        timeout-minutes: 20
        run: n8n execute --id carousel01

      - name: Save slides if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-debug
          path: C:\carousel\run\*.jpg
          retention-days: 3
          if-no-files-found: ignore
